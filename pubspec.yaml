name: flutter_todo_app
description: A cross-platform todo application with advanced features
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1

  # 数据库
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  mysql1: ^0.20.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # UI组件
  flutter_colorpicker: ^1.0.3
  intl: ^0.18.1

  # 桌面窗口管理
  window_manager: ^0.3.7
  desktop_multi_window: ^0.1.3

  # 文件选择
  file_picker: ^6.1.1

  # JSON处理
  json_annotation: ^4.8.1

  # 共享首选项
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
